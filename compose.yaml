services:
  whisper:
    build:
      context: .
      dockerfile: Dockerfile
    image: orioninsist/whisper:cpu-test
    user: "1000:1000"
    working_dir: /app
    environment:
      XDG_CACHE_HOME: /workspace/models
    volumes:
      - ./orioninsist:/workspace:Z
    command: ["python", "-m", "whisper", "--help"]
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
