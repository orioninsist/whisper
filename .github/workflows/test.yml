name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  whisper-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v6
        with:
          version: "0.12.24"
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: uv sync --locked --no-default-groups --extra dev
      - name: Run tests
        run: uv run --locked --no-sync --extra dev pytest --durations=0 -vv -k 'not test_transcribe or test_transcribe[tiny] or test_transcribe[tiny.en]' -m 'not requires_cuda'
